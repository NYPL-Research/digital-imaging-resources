baseURL: 'https://nypl.github.io/digital-imaging-resources/'
languageCode: 'en-us'
title: 'Digital Imaging Resources'

module:
  imports:
    - path: github.com/imfing/hextra

caches:
  images:
    dir: :cacheDir/images

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
        enable: true

enableInlineShortcodes: true

menu:
  main:
    - identifier: about
      name: Digital Imaging Resources
      pageRef: /docs
      weight: 1
    - identifier: gen_docs
      name: General
      pageRef: docs/gen_documents
      weight: 2
    - identifier: tech_docs
      name: Technical
      pageRef: docs/tech_documents
      weight: 3
