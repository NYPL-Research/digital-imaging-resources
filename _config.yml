title: Digital Imaging Services
description: >- # this means to ignore newlines until "baseurl:"
  Digital Imaging Services, New York Public Library
baseurl: "/digital-imaging-resources" # the subpath of your site, e.g. /blog
url: "https://nypl.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
remote_theme: just-the-docs/just-the-docs@v0.4.0
color_scheme: "dark"
plugins:
  - jekyll-feed
  - jekyll-sitemap

collections:
  tech_documents:
    output: true
  gen_documents:
    output: true

just_the_docs:
  search_enabled: true
  collections:
    tech_documents:
      name: Technical Documents
      nav_fold: true
    gen_documents:
      name: About the Digital Imaging Program
      nav_fold: true
  

back_to_top: true
back_to_top_text: "Back to Top"

markdown: kramdown
kramdown:
  parse_block_html: true
  parse_span_html: true
